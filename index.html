  var BLK = [null, [10, [[1, 16]]], [16, [[1, 28]]], [26, [[1, 44]]], [18, [[2, 32]]], [24, [[2, 43]]], [16, [[4, 27]]], [18, [[4, 31]]], [22, [[2, 38], [2, 39]]], [22, [[3, 36], [2, 37]]], [26, [[4, 43], [1, 44]]]];
  var ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];

    var spec = BLK[v], ec = spec[0], blocks = [], pos = 0;

      function (r, c) { return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0; }, function (r, c) { return r * c % 2 + r * c % 3 === 0; },
      function (r, c) { return (r * c % 2 + r * c % 3) % 2 === 0; }, function (r, c) { return ((r + c) % 2 + r * c % 3) % 2 === 0; }];
    function withMask(mk) {
      var G = M.map(function (row) { return row.slice(); });
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (!F[r][c] && maskFn[mk](r, c)) G[r][c] = !G[r][c];
      var f = bch(0 << 3 | mk, 0x537, 10) ^ 0x5412;                      // ECC level M = 00

        if (i < 8) G[8][n - 1 - i] = bit; else if (i < 9) G[8][15 - i] = bit; else G[8][14 - i] = bit; }

    }
    function penalty(G) {
      var p = 0, r, c, run, i;
      for (var pass = 0; pass < 2; pass++) for (r = 0; r < n; r++) { run = 1;
        for (c = 1; c < n; c++) { var a = pass ? G[c][r] : G[r][c], b = pass ? G[c - 1][r] : G[r][c - 1]; if (a === b) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; }

      for (r = 0; r < n - 1; r++) for (c = 0; c < n - 1; c++) if (G[r][c] === G[r][c + 1] && G[r][c] === G[r + 1][c] && G[r][c] === G[r + 1][c + 1]) p += 3;
      var dark = 0; G.forEach(function (row) { row.forEach(function (x) { if (x) dark++; }); });
      return p + Math.floor(Math.abs(dark * 20 - n * n * 10) / (n * n)) * 10;

    for (var mk = 0; mk < 8; mk++) { var G = withMask(mk), pn = penalty(G); if (pn < bp) { bp = pn; best = G; } }

<script>
/* SRMAuth - account system for the static (GitHub Pages) build.
   Accounts live in this browser's localStorage. Passwords are never stored: only a salted PBKDF2-SHA256 hash.
   Because there is no server, this protects against casual access on a shared computer; it cannot replace server-side auth. */
(function () {
  var USERS = "srm_users_v1", SESSION = "srm_session_v1", TRIPS = "srm_trips_v1:", TRY = "srm_try_v1:";
  var SESSION_MS = 8 * 3600 * 1000, MAX_TRIES = 5, LOCK_MS = 5 * 60 * 1000, ITER = 150000;

  function jget(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function jset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }

    var s = jget(SESSION, null);
    if (!s || !s.email || !s.exp || s.exp < Date.now()) { try { localStorage.removeItem(SESSION); } catch (e) {} return null; }
    var u = jget(USERS, {})[s.email];
    return u ? { email: s.email, name: u.name, exp: s.exp } : null;
  }
  function startSession(email) { jset(SESSION, { email: email, exp: Date.now() + SESSION_MS }); }

  var api = {
    user: function () { var s = session(); return s ? { name: s.name, email: s.email } : { name: "Guest", email: "" }; },
    initials: function () { var n = api.user().name.trim().split(/\s+/); return ((n[0] || "?")[0] + (n.length > 1 ? n[n.length - 1][0] : "")).toUpperCase(); },
    loggedIn: function () { return !!session(); },
    logout: function () { try { localStorage.removeItem(SESSION); } catch (e) {} try { sessionStorage.clear(); } catch (e) {} location.reload(); },
    loadTrips: function () { var s = session(); return s ? jget(TRIPS + s.email, []) : []; },
    saveTrips: function (t) { var s = session(); if (s && Array.isArray(t)) jset(TRIPS + s.email, t); },

  setInterval(function () { if (api.loggedIn() === false && !document.getElementById("srm-auth")) location.reload(); }, 30000);
  if (session()) return;

  /* ---------- login / register screen ---------- */
  var css = document.createElement("style");
  css.textContent =
    "#srm-auth{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;" +
    "background:radial-gradient(900px 400px at 85% -10%,#FFE8D6,transparent 60%),linear-gradient(135deg,#F8FAFF,#EEF2FF);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#0F172A}" +
    "#srm-auth .card{width:100%;max-width:420px;background:#fff;border:1px solid #E5E7EB;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.14);padding:28px}" +
    "#srm-auth .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}#srm-auth .brand img{height:48px;width:auto}" +
    "#srm-auth .brand b{display:block;font-size:17px}#srm-auth .brand span{font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:.6px;font-weight:600}" +
    "#srm-auth .tabs{display:flex;background:#F1F5F9;border-radius:999px;padding:4px;margin-bottom:18px}" +
    "#srm-auth .tabs button{flex:1;border:0;background:none;padding:9px;border-radius:999px;font-weight:600;font-size:14px;font-family:inherit;color:#64748B;cursor:pointer}" +
    "#srm-auth .tabs button.on{background:#fff;color:#0F172A;box-shadow:0 1px 4px rgba(0,0,0,.12)}" +
    "#srm-auth label{display:block;font-size:12px;font-weight:700;color:#475569;margin:12px 0 5px}" +
    "#srm-auth .in{position:relative}#srm-auth input{width:100%;box-sizing:border-box;height:44px;border:1px solid #CBD5E1;border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;outline:none;background:#fff;color:#0F172A}" +
    "#srm-auth input:focus{border-color:#FF6B00;box-shadow:0 0 0 3px rgba(255,107,0,.18)}#srm-auth input.bad{border-color:#DC2626}" +
    "#srm-auth .eye{position:absolute;right:6px;top:6px;height:32px;border:0;background:none;color:#64748B;font-weight:600;font-size:12px;font-family:inherit;cursor:pointer;padding:0 8px}" +
    "#srm-auth .msg{min-height:20px;margin:12px 0 4px;font-size:13px;color:#DC2626}#srm-auth .msg.ok{color:#15803D}" +
    "#srm-auth .go{width:100%;height:46px;border:0;border-radius:999px;background:#FF6B00;color:#fff;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}" +
    "#srm-auth .go:hover{background:#E65F00}#srm-auth .go:disabled{opacity:.6;cursor:wait}" +
    "#srm-auth .hint{font-size:11px;color:#94A3B8;margin-top:14px;line-height:1.5}";
  document.head.appendChild(css);

  var mode = "register", root = document.createElement("div");
  root.id = "srm-auth"; root.setAttribute("role", "dialog"); root.setAttribute("aria-modal", "true"); root.setAttribute("aria-label", "Sign in to SRM Railways");
  function el(tag, attrs, kids) { var e = document.createElement(tag); for (var k in (attrs || {})) { if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); } (kids || []).forEach(function (c) { e.appendChild(c); }); return e; }

  function field(id, label, type, ph, ac, withEye) {
    var input = el("input", { id: id, type: type, placeholder: ph, autocomplete: ac, "aria-label": label }), wrap = el("div", { "class": "in" }, [input]);
    if (withEye) { var b = el("button", { type: "button", "class": "eye", text: "Show", "aria-label": "Show or hide password" }); b.onclick = function () { var h = input.type === "password"; input.type = h ? "text" : "password"; b.textContent = h ? "Hide" : "Show"; }; wrap.appendChild(b); }
    return [el("label", { "for": id, text: label }), wrap];
  }
  function render() {
    root.innerHTML = "";
    var logo = el("img", { alt: "SRM University AP", src: window.__SRM_LOGO || "" });
    var tabs = el("div", { "class": "tabs", role: "tablist" }, ["login", "register"].map(function (m) {
      var b = el("button", { type: "button", role: "tab", "aria-selected": String(mode === m), "class": mode === m ? "on" : "", text: m === "login" ? "Login" : "Register" });
      b.onclick = function () { mode = m; render(); }; return b; }));
    var form = el("form", { novalidate: "novalidate" });
    var kids = [];
    if (mode === "register") kids = kids.concat(field("a-name", "Full name", "text", "e.g. Swayam Singh", "name"));
    kids = kids.concat(field("a-email", "Email", "email", "you@example.com", mode === "login" ? "username" : "email"));
    kids = kids.concat(field("a-pw", "Password", "password", mode === "login" ? "Your password" : "8+ characters, letters and digits", mode === "login" ? "current-password" : "new-password", true));
    if (mode === "register") kids = kids.concat(field("a-pw2", "Confirm password", "password", "Re-enter password", "new-password"));
    kids.forEach(function (k) { form.appendChild(k); });
    var msg = el("div", { "class": "msg", role: "alert", "aria-live": "polite" });
    var go = el("button", { type: "submit", "class": "go", text: mode === "login" ? "Login" : "Register" });
    form.appendChild(msg); form.appendChild(go);
    form.appendChild(el("div", { "class": "hint", text: "Accounts are stored in this browser only. Passwords are hashed (PBKDF2-SHA256) and never saved in plain text." }));
    form.onsubmit = function (e) { e.preventDefault(); submit(form, msg, go); };
    root.appendChild(el("div", { "class": "card" }, [el("div", { "class": "brand" }, [logo, el("div", {}, [el("b", { text: "SRM Railways" }), el("span", { text: "Reservation System" })])]), tabs, form]));
    setTimeout(function () { var f = root.querySelector("input"); if (f && !document.activeElement.id) f.focus(); }, 0);
  }
  function val(id) { var e = document.getElementById(id); return e ? e.value : ""; }
  function fail(msg, text, ids) { msg.className = "msg"; msg.textContent = text; (ids || []).forEach(function (i) { var e = document.getElementById(i); if (e) e.classList.add("bad"); }); }

    Array.prototype.forEach.call(form.querySelectorAll("input"), function (i) { i.classList.remove("bad"); });
    msg.textContent = ""; var email = val("a-email").trim().toLowerCase(), pw = val("a-pw");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail(msg, "Enter a valid email address.", ["a-email"]);

      var name = val("a-name").trim().replace(/\s+/g, " ");
      if (!/^[A-Za-z][A-Za-z .'\-]{2,39}$/.test(name)) return fail(msg, "Enter your full name (3-40 letters).", ["a-name"]);
      if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return fail(msg, "Password needs 8+ characters with letters and digits.", ["a-pw"]);

        document.getElementById("a-email").value = email;
        var m = root.querySelector(".msg"); m.className = "msg ok"; m.textContent = "Registration successful. Please log in to continue.";
        document.getElementById("a-pw").focus();

    var u = jget(USERS, {})[email], salt2 = u ? unhex(u.salt) : crypto.getRandomValues(new Uint8Array(16));   // dummy hash when the user is unknown keeps timing similar

      if (u && same(h, u.hash)) { try { localStorage.removeItem(TRY + email); } catch (e) {} startSession(email); location.reload(); return; }

      go.disabled = false; go.textContent = "Login"; document.getElementById("a-pw").value = "";
      fail(msg, t.until > Date.now() ? "Too many failed attempts. Locked for 5 minutes." : "Invalid email or password.", ["a-pw"]);
    }).catch(function (err) { go.disabled = false; go.textContent = "Login"; fail(msg, err.message); });
  }

  function mount() {
    document.body.appendChild(root); document.body.style.overflow = "hidden";
    var app = document.getElementById("root"); if (app) app.setAttribute("inert", "");   // keep keyboard focus out of the app while logged out
    render();
    window.addEventListener("load", function () { var i = root.querySelector(".brand img"); if (i && window.__SRM_LOGO) i.src = window.__SRM_LOGO; });
  }
